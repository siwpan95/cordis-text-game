<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>迷雾地窖 · 网页版</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Cascadia Code", "Fira Code", Consolas, "PingFang SC", "Microsoft YaHei", monospace;
      background: #14111a;
      color: #e8e2f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    h1 {
      margin: 0;
      padding: 14px 18px;
      font-size: 18px;
      letter-spacing: 2px;
      background: #1f1a2b;
      border-bottom: 1px solid #322a45;
      color: #c9a7ff;
    }
    #out {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .line { margin: 0 0 2px; }
    #actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 18px 10px;
      border-top: 1px solid #322a45;
      background: #1a1626;
    }
    #actions:empty { display: none; }
    .group {
      align-self: center;
      font-size: 12px;
      color: #8b7fb0;
      letter-spacing: 1px;
      margin-left: 10px;
    }
    .chip {
      background: #2c2440;
      color: #d9cdf5;
      border: 1px solid #4a3f63;
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .chip:hover { background: #6b4ea8; color: #fff; border-color: #c9a7ff; }
    #form {
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid #322a45;
      background: #1f1a2b;
    }
    #cmd {
      flex: 1;
      background: #14111a;
      border: 1px solid #4a3f63;
      border-radius: 6px;
      color: #e8e2f0;
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }
    #cmd:focus { border-color: #c9a7ff; }
    button {
      background: #6b4ea8;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0 18px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #7d5ec4; }
  </style>
</head>
<body>
  <h1>迷雾地窖 · 网页版</h1>
  <div id="out"></div>
  <div id="actions"></div>
  <form id="form" autocomplete="off">
    <input id="cmd" placeholder="> 输入 help 查看指令" />
    <button type="submit">发送</button>
  </form>
  <script type="module" src="./game.js"></script>
</body>
</html>
